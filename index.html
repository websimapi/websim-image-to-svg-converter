<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to SVG Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Image to SVG Converter</h1>
        
        <div class="upload-section">
            <label for="imageUpload" class="upload-button">
                Upload Image
                <input type="file" id="imageUpload" accept="image/*">
            </label>
            <p class="or">OR</p>
            <div class="prompt-section">
                <input type="text" id="imagePrompt" placeholder="Describe an image to generate...">
                <button id="generateBtn">Generate</button>
            </div>
        </div>
        
        <div class="preview-section">
            <div class="preview-container">
                <div id="imagePreview">
                    <p>Your image will appear here</p>
                </div>
                <div id="svgPreview">
                    <p>SVG will appear here</p>
                </div>
            </div>
            <div class="controls">
                <div class="preset-buttons">
                    <button class="preset-btn" data-preset="cartoon">Cartoon</button>
                    <button class="preset-btn" data-preset="minimal">Minimal</button>
                    <button class="preset-btn" data-preset="detailed">Detailed</button>
                    <button class="preset-btn" data-preset="custom">Custom</button>
                </div>
                <div class="settings-container">
                    <div class="slider-container">
                        <label for="detailLevel">Detail Level:</label>
                        <div class="slider-wrapper">
                            <input type="range" id="detailLevel" min="1" max="10" value="5">
                            <span id="detailValue">5</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label for="colorCount">Color Count:</label>
                        <div class="slider-wrapper">
                            <input type="range" id="colorCount" min="2" max="20" value="8">
                            <span id="colorValue">8</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label for="simplifyLevel">Simplify Level:</label>
                        <div class="slider-wrapper">
                            <input type="range" id="simplifyLevel" min="1" max="10" value="3">
                            <span id="simplifyValue">3</span>
                        </div>
                    </div>
                </div>
                <button id="convertBtn" disabled>Convert to SVG</button>
                <button id="downloadBtn" disabled>Download SVG</button>
            </div>
        </div>
        
        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
